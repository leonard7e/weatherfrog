[package]
name = "weatherfrog"
version = "0.1.0"
edition = "2024"
description = "A Rust CLI weather application using the Zero Cost Weather API"
authors = ["WeatherFrog"]

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
dirs = "6"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"

[lints.rust]
unsafe_code = "deny"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1